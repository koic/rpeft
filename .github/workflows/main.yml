name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Unit tests never load PyCall or Python, so a green run also proves
  # that `require "rpeft"` works without a Python environment.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
